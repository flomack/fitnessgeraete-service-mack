# Hält das kostenlose Supabase-Projekt wach (es pausiert sonst nach ca. 1 Woche ohne Zugriff).
# Braucht die Repository-Variablen SUPABASE_URL und SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables).
name: Supabase wachhalten
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Anfrage an Supabase
        env: { URL: "${{ vars.SUPABASE_URL }}", KEY: "${{ vars.SUPABASE_ANON_KEY }}" }
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Variablen nicht gesetzt – übersprungen"; exit 0; fi
          curl -fsS "$URL/rest/v1/tickets?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
